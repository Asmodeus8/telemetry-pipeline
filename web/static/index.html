<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry Pipeline</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7b6c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span>Telemetry Pipeline</div>
  <div class="live" id="live"><span class="dot"></span><span id="live-text">Connecting</span></div>
</header>

<div class="layout">
  <aside class="devices">
    <h2>Devices</h2>
    <ul id="device-list"></ul>
  </aside>

  <main>
    <section class="head">
      <div>
        <h1 id="device-name">—</h1>
        <p id="device-seen" class="muted"></p>
      </div>
      <div class="alerts" id="alerts"></div>
    </section>

    <section class="tiles" id="tiles"></section>

    <section class="chart-card">
      <div class="chart-head">
        <h3 id="chart-title">Select a metric</h3>
        <div class="ranges" role="tablist">
          <button data-range="15m" class="on">15 min</button>
          <button data-range="6h">6 h</button>
          <button data-range="7d">7 d</button>
        </div>
      </div>
      <canvas id="chart"></canvas>
      <p class="muted small" id="chart-note"></p>
    </section>
  </main>
</div>

<footer class="stats" id="stats"></footer>
<script src="app.js"></script>
</body>
</html>
