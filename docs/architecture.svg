<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5b636c"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#d5d9d2;stroke-width:1.5}
      .core{fill:#f2faf8;stroke:#0f7b6c;stroke-width:1.5}
      .t{font-size:15px;font-weight:650;fill:#15181c}
      .s{font-size:12.5px;fill:#5b636c}
      .k{font-size:11px;font-weight:700;letter-spacing:1.2px;fill:#0f7b6c}
      .l{stroke:#5b636c;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .q{stroke:#0f7b6c;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .bus{stroke:#5b636c;stroke-width:1.6;fill:none}
      .lab{font-size:11.5px;fill:#0f7b6c}
    </style>
  </defs>
  <rect width="1040" height="470" rx="18" fill="#f6f7f4"/>

  <text x="32" y="44" class="k">DEVICES</text>
  <rect class="box" x="32" y="62" width="190" height="66" rx="10"/>
  <text x="48" y="90" class="t">ESP32 gateways</text>
  <text x="48" y="110" class="s">inverters, meters</text>
  <rect class="box" x="32" y="142" width="190" height="66" rx="10"/>
  <text x="48" y="170" class="t">Sensor nodes</text>
  <text x="48" y="190" class="s">cold rooms, weather</text>
  <rect class="box" x="32" y="222" width="190" height="66" rx="10"/>
  <text x="48" y="250" class="t">Any MQTT client</text>
  <text x="48" y="270" class="s">JSON on devices/{id}/telemetry</text>

  <rect class="box" x="262" y="128" width="150" height="96" rx="10"/>
  <text x="278" y="160" class="t">Mosquitto</text>
  <text x="278" y="180" class="s">MQTT broker</text>
  <text x="278" y="200" class="s">QoS 1</text>
  <path class="l" d="M222 95 C244 95 240 156 260 156"/>
  <path class="l" d="M222 175 H260"/>
  <path class="l" d="M222 255 C244 255 240 196 260 196"/>

  <text x="452" y="44" class="k">GO PIPELINE</text>
  <rect class="core" x="452" y="58" width="322" height="346" rx="14"/>
  <path class="l" d="M412 176 C436 176 436 103 490 103"/>

  <rect class="box" x="492" y="76" width="262" height="54" rx="9"/>
  <text x="508" y="99" class="t">Parse and validate</text>
  <text x="508" y="118" class="s">topic → device ID · flatten · type checks</text>

  <path class="bus" d="M492 112 H474 V352"/>
  <path class="l" d="M474 178 H490"/>
  <path class="l" d="M474 261 H490"/>
  <path class="l" d="M474 352 H490"/>

  <rect class="box" x="492" y="150" width="262" height="56" rx="9"/>
  <text x="508" y="174" class="t">Batcher</text>
  <text x="508" y="193" class="s">bulk COPY · retries · bounded queue</text>

  <rect class="box" x="492" y="232" width="262" height="58" rx="9"/>
  <text x="508" y="256" class="t">Alert engine</text>
  <text x="508" y="276" class="s">thresholds with hold time · offline detection</text>

  <rect class="box" x="492" y="314" width="112" height="80" rx="9"/>
  <text x="506" y="340" class="t">Live hub</text>
  <text x="506" y="359" class="s">fan-out</text>
  <text x="506" y="376" class="s">drops slow</text>
  <rect class="box" x="624" y="314" width="130" height="80" rx="9"/>
  <text x="638" y="340" class="t">HTTP API</text>
  <text x="638" y="359" class="s">REST queries</text>
  <text x="638" y="376" class="s">SSE stream</text>
  <path class="l" d="M604 354 H622"/>

  <text x="820" y="44" class="k">STORAGE AND CLIENTS</text>
  <rect class="box" x="820" y="122" width="190" height="112" rx="10"/>
  <text x="836" y="150" class="t">TimescaleDB</text>
  <text x="836" y="170" class="s">readings hypertable</text>
  <text x="836" y="189" class="s">1m and 1h continuous</text>
  <text x="836" y="206" class="s">aggregates</text>
  <text x="836" y="223" class="s">30-day retention</text>
  <path class="l" d="M754 178 H818"/>

  <rect class="box" x="820" y="250" width="190" height="56" rx="10"/>
  <text x="836" y="273" class="t">Telegram / webhook</text>
  <text x="836" y="292" class="s">firing and resolved</text>
  <path class="l" d="M754 278 H818"/>

  <rect class="box" x="820" y="322" width="190" height="72" rx="10"/>
  <text x="836" y="348" class="t">Live dashboard</text>
  <text x="836" y="368" class="s">embedded in the binary</text>
  <path class="l" d="M754 358 H818"/>

  <path class="q" d="M1010 200 H1024 V420 H689 V396"/>
  <text x="800" y="414" class="lab">queries: raw, 1m and 1h buckets</text>

  <text x="32" y="452" class="s">One Go binary. Each reading is parsed once, then written in bulk, pushed live and checked against alert rules.</text>
</svg>
