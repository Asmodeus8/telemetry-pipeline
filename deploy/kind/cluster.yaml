# Local cluster: one control plane and two workers, so pod spreading and
# disruption budgets do something real. Port 80 reaches the Gateway; 1884
# reaches the MQTT broker for real devices on the LAN.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: telemetry
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 31883
        hostPort: 1884
        protocol: TCP
  - role: worker
  - role: worker
