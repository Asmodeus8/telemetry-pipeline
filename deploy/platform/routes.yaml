# Each route lives next to its backend, so no ReferenceGrant is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs: [{ name: gateway, namespace: gateway }]
  hostnames: [argocd.localhost]
  rules:
    - backendRefs: [{ name: argocd-server, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs: [{ name: gateway, namespace: gateway }]
  hostnames: [grafana.localhost]
  rules:
    - backendRefs: [{ name: monitoring-grafana, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs: [{ name: gateway, namespace: gateway }]
  hostnames: [prometheus.localhost]
  rules:
    - backendRefs: [{ name: monitoring-prometheus, port: 9090 }]
