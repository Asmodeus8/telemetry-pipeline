# Load test: replays 10 days of readings at 10-second spacing (about 260k messages)
# as fast as the broker accepts them, to watch the ingest autoscaler react.
#   kubectl -n telemetry create -f deploy/load/burst.yaml
#   kubectl -n telemetry get hpa telemetry-ingest -w
apiVersion: batch/v1
kind: Job
metadata:
  generateName: load-burst-
  labels:
    app.kubernetes.io/component: load
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  parallelism: 4
  completions: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/component: load
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: burst
          image: ghcr.io/asmodeus8/telemetry-pipeline:latest
          command: [/usr/local/bin/simulate, -broker, tcp://telemetry-mqtt:1883, -backfill, 240h, -step, 10s, -recent, 10s, -every, "0"]
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
