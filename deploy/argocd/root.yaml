# App of apps: Argo CD watches deploy/argocd/apps and creates everything listed there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io/background]
spec:
  project: default
  source:
    repoURL: https://github.com/Asmodeus8/telemetry-pipeline.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
