apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tp.fullname" . }}-smoke
  labels: {{- include "tp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: smoke
      image: curlimages/curl:8.17.0
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      command: [sh, -c]
      args:
        - |
          set -e
          for svc in ingest api{{ if .Values.alerts.enabled }} alerts{{ end }}; do
            curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://{{ include "tp.fullname" . }}-$svc:8080/readyz
            echo " $svc"
          done
          curl -fsS http://{{ include "tp.fullname" . }}-api:8080/api/devices
          curl -fsS http://{{ include "tp.fullname" . }}-ingest:8080/metrics | grep -q telemetry_build_info
          echo ok
